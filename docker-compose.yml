services:
  mqtt-broker:
    build:
      context: .
      dockerfile: mosquitto/Dockerfile
    container_name: nexora-mqtt
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME is required}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is required}
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexora-backend
    depends_on:
      - mqtt-broker
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME is required}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is required}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: simulation/Dockerfile
    container_name: nexora-simulator
    depends_on:
      - mqtt-broker
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME is required}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is required}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    container_name: nexora-frontend
    depends_on:
      - backend
    restart: unless-stopped

  reverse-proxy:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    container_name: nexora-proxy
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    environment:
      APP_BASIC_AUTH_USERNAME: ${APP_BASIC_AUTH_USERNAME:?APP_BASIC_AUTH_USERNAME is required}
      APP_BASIC_AUTH_PASSWORD: ${APP_BASIC_AUTH_PASSWORD:?APP_BASIC_AUTH_PASSWORD is required}
    ports:
      - "${PROXY_PORT:-80}:80"
